<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAMBEAUTIES — Avis & Réseaux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      font-family: 'Montserrat', sans-serif;
      /* Utilise directement ta photo bg.jpg sans la modifier */
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center bottom;
      background-repeat: no-repeat;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: rgba(232, 219, 203, 0.84);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-radius: 28px;
      padding: 0 24px 28px 24px;
      margin-top: 56px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      text-align: center;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 0.7s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .logo-wrap {
      width: 114px;
      height: 114px;
      margin: -57px auto 18px auto;
      border-radius: 50%;
      background: #2b211b;
      border: 3px solid rgba(255, 250, 244, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f6efe6;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      opacity: 0;
      transform: scale(0.92);
      animation: popIn 0.6s ease 0.15s forwards;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-title {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      line-height: 1.3;
      padding: 0 6px;
    }

    .logo-sub {
      font-size: 7.5px;
      letter-spacing: 2px;
      opacity: 0.8;
      margin-top: 2px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #2c241e;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(10px);
      animation: fadeUp 0.55s ease 0.25s forwards;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: rgba(252, 249, 245, 0.94);
      color: #2c241e;
      border: 1px solid rgba(92, 74, 58, 0.22);
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(44, 36, 30, 0.08);
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
      opacity: 0;
      transform: translateY(12px);
    }

    .btn:nth-child(1) { animation: fadeUp 0.5s ease 0.35s forwards, softPulse 2.8s ease-in-out 1.4s infinite; }
    .btn:nth-child(2) { animation: fadeUp 0.5s ease 0.45s forwards; }
    .btn:nth-child(3) { animation: fadeUp 0.5s ease 0.55s forwards; }
    .btn:nth-child(4) { animation: fadeUp 0.5s ease 0.65s forwards; }

    .btn:hover {
      transform: translateY(-2px);
      background: #ffffff;
      box-shadow: 0 8px 18px rgba(44, 36, 30, 0.14);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .socials {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      opacity: 0;
      animation: fadeUp 0.55s ease 0.75s forwards;
    }

    .socials a {
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.45));
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .socials a:hover {
      transform: translateY(-2px) scale(1.08);
      opacity: 0.9;
    }

    .socials svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @keyframes fadeUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes popIn {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes softPulse {
      0%, 100% {
        box-shadow: 0 4px 12px rgba(44, 36, 30, 0.08);
      }
      50% {
        box-shadow: 0 6px 20px rgba(44, 36, 30, 0.22);
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo-wrap">
      <!-- Si tu ajoutes un fichier logo.png dans GitHub, remplace les 2 lignes suivantes par : <img src="logo.png" alt="Logo SAMBEAUTIES"> -->
      <span class="logo-title">SAMBEAUTIES</span>
      <span class="logo-sub">RÉPUBLIQUE
