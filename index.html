<head>

  <title>SAMBEAUTIES — Avis & Réseaux</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      font-family: 'Montserrat', sans-serif;
      background-color: #e8dbcb;
      background-image: url('bg.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .card {
      width: 100%;
      max-width: 390px;
      background: rgba(232, 219, 203, 0.88);
      border-radius: 28px;
      padding: 0 24px 28px 24px;
      margin-top: 56px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.22);
      text-align: center;
      animation: slideUp 0.6s ease-out both;
    }

    .logo-wrap {
      width: 114px;
      height: 114px;
      margin: -57px auto 18px auto;
      border-radius: 50%;
      background: #2b211b;
      border: 3px solid #faf5ef;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #f6efe6;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      overflow: hidden;
      animation: popScale 0.55s ease-out both;
    }

    .logo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .logo-title {
      font-family: 'Cinzel', serif;
      font-size: 11px;
      letter-spacing: 1.5px;
      line-height: 1.3;
      padding: 0 6px;
    }

    .logo-sub {
      font-size: 7.5px;
      letter-spacing: 2px;
      opacity: 0.85;
      margin-top: 2px;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 21px;
      font-weight: 500;
      letter-spacing: 1.5px;
      color: #2c241e;
      margin-bottom: 24px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      background: #fcf9f5;
      color: #2c241e;
      border: 1px solid rgba(92, 74, 58, 0.25);
      border-radius: 14px;
      padding: 15px 18px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      box-shadow: 0 4px 12px rgba(44, 36, 30, 0.08);
      transition: transform 0.18s ease, box-shadow 0.18s ease, background-color 0.18s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background-color: #ffffff;
      box-shadow: 0 8px 18px rgba(44, 36, 30, 0.14);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      animation: gentleFloat 2.8s ease-in-out infinite;
    }

    .socials {
      margin-top: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
    }

    .socials a {
      color: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.5));
      transition: transform 0.18s ease, opacity 0.18s ease;
    }

    .socials a:hover {
      transform: translateY(-2px) scale(1.08);
      opacity: 0.9;
    }

    .socials svg {
      width: 24px;
      height: 24px;
      fill: currentColor;
    }

    @keyframes slideUp {
      from {
        transform: translateY(18px);
      }
      to {
        transform: translateY(0);
      }
    }

    @keyframes popScale {
      from {
        transform: scale(0.94);
      }
      to {
        transform: scale(1);
      }
    }

    @keyframes gentleFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2px);
      }
    }
  </style>
</head>
